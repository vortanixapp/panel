name: vortanix

x-panel: &panel
  build:
    context: ..
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://vortanix:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/vortanix?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    RELAY_URL: http://relay:8082
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vortanix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: vortanix
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vortanix -d vortanix"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *panel
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        COMPONENT: vortanix-api
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *panel
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        COMPONENT: vortanix-worker
    depends_on:
      api:
        condition: service_healthy

  relay:
    <<: *panel
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        COMPONENT: vortanix-relay

  console:
    <<: *panel
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        COMPONENT: vortanix-console

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PANEL_URL:-}
      NEXT_PUBLIC_CONSOLE_URL: ${CONSOLE_URL:-}
      API_INTERNAL_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?run scripts/init-env.sh — it sets the address the panel answers on}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

volumes:
  postgres:
  redis:
  uploads:
  caddy-data:
  caddy-config:
