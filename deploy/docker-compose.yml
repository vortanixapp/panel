name: vortanix

x-panel: &panel
  build:
    context: ..
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://vortanix:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/vortanix?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    RELAY_URL: http://relay:8082
    UPDATER_URL: http://updater:8090
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vortanix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: vortanix
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vortanix -d vortanix"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *panel
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        COMPONENT: vortanix-api
    volumes:
      - uploads:/app/uploads
      - monitoring-auth:/monitoring:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *panel
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        COMPONENT: vortanix-worker
    depends_on:
      api:
        condition: service_healthy

  relay:
    <<: *panel
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        COMPONENT: vortanix-relay
    ports:
      - "${RELAY_TLS_PORT:-8443}:${RELAY_TLS_PORT:-8443}"

  console:
    <<: *panel
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        COMPONENT: vortanix-console

  updater:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        COMPONENT: vortanix-updater
    restart: unless-stopped
    user: "0:0"
    environment:
      INTERNAL_SECRET: ${INTERNAL_SECRET:?set INTERNAL_SECRET in deploy/.env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PANEL_URL:-}
      NEXT_PUBLIC_CONSOLE_URL: ${CONSOLE_URL:-}
      API_INTERNAL_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?run scripts/init-env.sh — it sets the address the panel answers on}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    depends_on:
      - api
      - relay

  monitoring-cert:
    image: alpine/openssl:latest
    restart: "no"
    environment:
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
    entrypoint:
      - sh
      - -c
      - |
        if [ ! -s /certs/cert.pem ] || [ ! -s /certs/key.pem ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj "/CN=vortanix-monitoring" -keyout /certs/key.pem -out /certs/cert.pem
        fi
        if [ -n "$$GRAFANA_ADMIN_PASSWORD" ]; then
          printf %s "$$GRAFANA_ADMIN_PASSWORD" > /auth/admin-password
        elif [ ! -s /auth/admin-password ]; then
          openssl rand -hex 16 | tr -d '[:space:]' > /auth/admin-password
        fi
        chmod 644 /certs/cert.pem /certs/key.pem /auth/admin-password
    volumes:
      - monitoring-certs:/certs
      - monitoring-auth:/auth

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    mem_limit: 384m
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /auth/admin-password
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /certs/cert.pem
      GF_SERVER_CERT_KEY: /certs/key.pem
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_BIND:-0.0.0.0}:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana:/var/lib/grafana
      - monitoring-certs:/certs:ro
      - monitoring-auth:/auth:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      monitoring-cert:
        condition: service_completed_successfully

volumes:
  postgres:
  redis:
  uploads:
  caddy-data:
  caddy-config:
  prometheus:
  grafana:
  monitoring-certs:
  monitoring-auth:
