name: Безопасность

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  go:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./... 2>&1 | tee govulncheck.txt
          exit "${PIPESTATUS[0]}"

      - name: сообщить о найденном
        if: failure()
        uses: actions/github-script@v7
        env:
          REPORT_FILE: govulncheck.txt
          REPORT_TITLE: "Уязвимости в Go-зависимостях (govulncheck)"
        with:
          script: |
            const fs = require("fs");
            const title = process.env.REPORT_TITLE;
            let body = "";
            try { body = fs.readFileSync(process.env.REPORT_FILE, "utf8").slice(-6000); } catch {}
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const text = `Ночная проверка нашла проблему: ${run}\n\n\`\`\`\n${body}\n\`\`\``;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "security", per_page: 100,
            });
            const same = open.find((issue) => issue.title === title);
            if (same) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: same.number, body: text });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body: text, labels: ["security"] });
            }

  web:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: npm audit
        run: |
          npm audit --audit-level=high 2>&1 | tee ../npm-audit.txt
          exit "${PIPESTATUS[0]}"

      - name: сообщить о найденном
        if: failure()
        uses: actions/github-script@v7
        env:
          REPORT_FILE: npm-audit.txt
          REPORT_TITLE: "Уязвимости в npm-зависимостях (npm audit)"
        with:
          script: |
            const fs = require("fs");
            const title = process.env.REPORT_TITLE;
            let body = "";
            try { body = fs.readFileSync(process.env.REPORT_FILE, "utf8").slice(-6000); } catch {}
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const text = `Ночная проверка нашла проблему: ${run}\n\n\`\`\`\n${body}\n\`\`\``;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "security", per_page: 100,
            });
            const same = open.find((issue) => issue.title === title);
            if (same) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: same.number, body: text });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body: text, labels: ["security"] });
            }
