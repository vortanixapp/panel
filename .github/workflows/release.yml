name: Release images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  panel:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component:
          - vortanix-api
          - vortanix-worker
          - vortanix-relay
          - vortanix-console
          - vortanix-metrics
          - vortanix-status
          - vortanix-agent
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            COMPONENT=${{ matrix.component }}
            VORTANIX_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/vortanix-buildcache:${{ matrix.component }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/vortanix-buildcache:${{ matrix.component }},mode=max,image-manifest=true,oci-mediatypes=true

  web:
    name: vortanix-web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/vortanix-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          platforms: linux/amd64
          build-args: |
            VORTANIX_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/vortanix-buildcache:web
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/vortanix-buildcache:web,mode=max,image-manifest=true,oci-mediatypes=true

  release:
    name: Выпуск на GitHub
    if: github.ref_type == 'tag'
    needs: [panel, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Выпуск $GITHUB_REF_NAME уже существует"
            exit 0
          fi
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then
            notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          else
            notes=""
          fi
          if [ -n "$(echo "$notes" | tr -d '[:space:]')" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
