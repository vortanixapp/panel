name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Не по формату:"
            echo "$unformatted"
            echo
            echo "Почините: gofmt -w ."
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: типы
        run: npx tsc --noEmit

      - name: сборка
        run: npm run build

  images:
    name: Рецепты образов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: собрать базовые слои
        run: |
          for layer in java native srcds steam; do
            echo "=== $layer ==="
            docker build -t "vortanix-runtime-$layer:ci" "deploy/images/_runtime/$layer"
          done
