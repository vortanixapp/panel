<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="Valheim">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(206, 40%, 17%)"/>
      <stop offset="1" stop-color="hsl(232, 36%, 8%)"/>
    </linearGradient>
    <pattern id="stripes" width="14" height="14" patternTransform="rotate(-38)" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="hsl(206, 60%, 70%)" stroke-opacity="0.06" stroke-width="7"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="hsl(206, 72%, 58%)" stop-opacity="0.16"/>
      <stop offset="1" stop-color="hsl(206, 72%, 58%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="320" height="180" fill="url(#bg)"/>
  <rect width="320" height="180" fill="url(#stripes)"/>
  <circle cx="240" cy="122" r="104" fill="url(#glow)"/>
  <path d="M22 168 L96 62 L170 168 Z" fill="hsl(206, 70%, 72%)" fill-opacity="0.08"/>
  <path d="M132 168 L214 86 L296 168 Z" fill="hsl(206, 70%, 72%)" fill-opacity="0.055"/>
  <rect width="320" height="180" fill="url(#fade)"/>
</svg>
