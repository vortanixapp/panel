<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="Rust">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(14, 40%, 17%)"/>
      <stop offset="1" stop-color="hsl(40, 36%, 8%)"/>
    </linearGradient>
    <pattern id="stripes" width="14" height="14" patternTransform="rotate(48)" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="hsl(14, 60%, 70%)" stroke-opacity="0.06" stroke-width="7"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="hsl(14, 72%, 58%)" stop-opacity="0.16"/>
      <stop offset="1" stop-color="hsl(14, 72%, 58%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="320" height="180" fill="url(#bg)"/>
  <rect width="320" height="180" fill="url(#stripes)"/>
  <circle cx="268" cy="132" r="104" fill="url(#glow)"/>
  <rect x="150.0" y="30.0" width="176" height="132" rx="14" fill="none" stroke="hsl(14, 70%, 72%)" stroke-opacity="0.050" stroke-width="1.5"/>
  <rect x="169.0" y="45.0" width="138" height="102" rx="11" fill="none" stroke="hsl(14, 70%, 72%)" stroke-opacity="0.072" stroke-width="1.5"/>
  <rect x="188.0" y="60.0" width="100" height="72" rx="8" fill="none" stroke="hsl(14, 70%, 72%)" stroke-opacity="0.094" stroke-width="1.5"/>
  <rect x="207.0" y="75.0" width="62" height="42" rx="5" fill="none" stroke="hsl(14, 70%, 72%)" stroke-opacity="0.116" stroke-width="1.5"/>
  <rect width="320" height="180" fill="url(#fade)"/>
</svg>
