<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="CS2">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(34, 40%, 17%)"/>
      <stop offset="1" stop-color="hsl(60, 36%, 8%)"/>
    </linearGradient>
    <pattern id="stripes" width="14" height="14" patternTransform="rotate(-22)" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="hsl(34, 60%, 70%)" stroke-opacity="0.06" stroke-width="7"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="hsl(34, 72%, 58%)" stop-opacity="0.16"/>
      <stop offset="1" stop-color="hsl(34, 72%, 58%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="320" height="180" fill="url(#bg)"/>
  <rect width="320" height="180" fill="url(#stripes)"/>
  <circle cx="68" cy="34" r="104" fill="url(#glow)"/>
  <rect x="196" y="34" width="7" height="96" rx="3.5" fill="hsl(34, 70%, 72%)" fill-opacity="0.090"/>
  <rect x="222" y="43" width="7" height="84" rx="3.5" fill="hsl(34, 70%, 72%)" fill-opacity="0.077"/>
  <rect x="248" y="52" width="7" height="72" rx="3.5" fill="hsl(34, 70%, 72%)" fill-opacity="0.064"/>
  <rect x="274" y="61" width="7" height="60" rx="3.5" fill="hsl(34, 70%, 72%)" fill-opacity="0.051"/>
  <rect x="300" y="70" width="7" height="48" rx="3.5" fill="hsl(34, 70%, 72%)" fill-opacity="0.038"/>
  <rect width="320" height="180" fill="url(#fade)"/>
</svg>
