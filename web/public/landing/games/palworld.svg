<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="Palworld">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(268, 40%, 17%)"/>
      <stop offset="1" stop-color="hsl(294, 36%, 8%)"/>
    </linearGradient>
    <pattern id="stripes" width="14" height="14" patternTransform="rotate(28)" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="hsl(268, 60%, 70%)" stroke-opacity="0.06" stroke-width="7"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="hsl(268, 72%, 58%)" stop-opacity="0.16"/>
      <stop offset="1" stop-color="hsl(268, 72%, 58%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="320" height="180" fill="url(#bg)"/>
  <rect width="320" height="180" fill="url(#stripes)"/>
  <circle cx="160" cy="26" r="104" fill="url(#glow)"/>
  <circle cx="222" cy="58" r="34" fill="hsl(268, 70%, 72%)" fill-opacity="0.100"/>
  <circle cx="268" cy="116" r="22" fill="hsl(268, 70%, 72%)" fill-opacity="0.075"/>
  <circle cx="180" cy="132" r="14" fill="hsl(268, 70%, 72%)" fill-opacity="0.050"/>
  <rect width="320" height="180" fill="url(#fade)"/>
</svg>
